[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_DEFAULT_MODE VITE_OPENROUTER_BASE_URL VITE_OPENROUTER_MODEL_FREE VITE_OPENROUTER_MODEL_NEMOTRON VITE_OPENROUTER_MODEL_GPTOSS VITE_OPENROUTER_MODEL_MINIMAX VITE_OPENROUTER_MODEL_DOLPHIN VITE_GEMINI_BASE_URL VITE_GEMINI_MODEL VITE_PRO_MODEL_V4 VITE_PRO_MODEL_V4_PRO VITE_PRO_BASE_URL"
  SECRETS_SCAN_OMIT_PATHS = ".env.example package-lock.json"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
