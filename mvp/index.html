<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Groq</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: #4361ee;
      color: #fff;
    }

    .msg.bot {
      align-self: flex-start;
      background: #16213e;
      border: 1px solid #0f3460;
    }

    .msg.thinking {
      font-style: italic;
      color: #888;
    }

    #input-area {
      padding: 16px;
      background: #16213e;
      display: flex;
      gap: 10px;
      border-top: 1px solid #0f3460;
    }

    #input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #0f3460;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 15px;
      outline: none;
    }

    #input:focus { border-color: #4361ee; }

    #send {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #4361ee;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #send:hover { background: #3a56d4; }
    #send:disabled { background: #555; cursor: not-allowed; }

    #chat { scrollbar-width: thin; scrollbar-color: #0f3460 transparent; }
  </style>
</head>
<body>
  <div id="chat"></div>
  <div id="input-area">
    <input id="input" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
    <button id="send">Enviar</button>
  </div>

  <script>
    const API_KEY = 'gsk-PEGUE-AQUI-SU-CLAVE-DE-GROQ';
    const MODEL = 'qwen/qwen3.6-27b';
    const API_URL = 'https://api.groq.com/openai/v1/chat/completions';

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    let messages = [];
    let isStreaming = false;

    function addMsg(text, role) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function send() {
      const text = input.value.trim();
      if (!text || isStreaming) return;

      isStreaming = true;
      sendBtn.disabled = true;
      input.value = '';

      addMsg(text, 'user');
      messages.push({ role: 'user', content: text });

      const botDiv = addMsg('', 'bot');

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: MODEL,
            messages: messages,
            temperature: 0.6,
            max_completion_tokens: 2048,
            top_p: 0.95,
            stream: true
          })
        });

        if (!res.ok) {
          const err = await res.text();
          botDiv.textContent = `Error ${res.status}: ${err}`;
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let full = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\n').filter(l => l.startsWith('data: '));

          for (const line of lines) {
            const data = line.slice(6);
            if (data === '[DONE]') break;

            try {
              const json = JSON.parse(data);
              const content = json.choices?.[0]?.delta?.content;
              if (content) {
                full += content;
                botDiv.textContent = full;
                chat.scrollTop = chat.scrollHeight;
              }
            } catch (e) {}
          }
        }

        messages.push({ role: 'assistant', content: full });
      } catch (e) {
        botDiv.textContent = `Error de conexión: ${e.message}`;
      } finally {
        isStreaming = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    input.focus();
  </script>
</body>
</html>
